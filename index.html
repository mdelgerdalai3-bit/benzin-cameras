<title>ШТС Камерууд</title>
<style>

  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.4 system-ui, "Segoe UI", Roboto, sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: var(--panel);
    border-bottom: 1px solid var(--line); padding: 10px 16px;
    display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
  h1 { font-size: 16px; margin: 0 8px 0 0; white-space: nowrap; }
  h1 span { color: var(--accent); }
  input, select, button { font: inherit; color: var(--text); background: #0f1115;
    border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
  input[type=search] { min-width: 200px; flex: 1 1 200px; max-width: 360px; }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  .stat { color: var(--muted); margin-left: auto; white-space: nowrap; }
  .pager { display: flex; gap: 6px; align-items: center; }
  main { padding: 12px 16px 24px; }
  .grid { display: grid; gap: 8px; grid-template-columns: repeat(var(--cols, 3), minmax(0, 1fr)); }
  .tile { position: relative; background: #000; border: 1px solid var(--line);
    border-radius: 10px; overflow: hidden; aspect-ratio: 16 / 9; }
  .tile video { width: 100%; height: 100%; object-fit: cover; display: block; background: #000; }
  .tile .cap { position: absolute; left: 0; right: 0; bottom: 0; padding: 18px 10px 6px;
    background: linear-gradient(transparent, rgba(0,0,0,.85)); pointer-events: none; }
  .tile .cap b { display: block; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile .cap small { display: block; color: #c3c8d4; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile .badge { position: absolute; top: 6px; left: 6px; font-size: 11px; padding: 2px 7px;
    border-radius: 999px; background: rgba(0,0,0,.65); color: var(--muted); }
  .tile .badge.live { color: var(--ok); }
  .tile .badge.err { color: var(--bad); }
  .tile .tools { position: absolute; top: 6px; right: 6px; display: flex; gap: 4px; opacity: 0; transition: opacity .15s; }
  .tile:hover .tools { opacity: 1; }
  .tile .tools button { padding: 2px 8px; font-size: 12px; background: rgba(0,0,0,.65); }
  .tile.fav { border-color: var(--accent); }
  .empty { color: var(--muted); padding: 40px; text-align: center; }
  .warn { background: #3a2a10; color: #ffd28a; border: 1px solid #6b4c16; padding: 10px 14px;
    border-radius: 8px; margin-bottom: 12px; }
  #big { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.92);
    display: flex; flex-direction: column; padding: 16px; }
  #big[hidden] { display: none; }
  #big .bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 8px; }
  #big video { flex: 1; width: 100%; min-height: 0; background: #000; border-radius: 8px; }
  @media (max-width: 700px) { .grid { grid-template-columns: 1fr !important; } .stat { margin-left: 0; } }
</style>
</head>

const API = 'https://benzin.mn/api/stations?limit=3000';
const MAX_RETRIES = 8;          // 480p дамжуулалт сэрэхэд 10-30с 404 өгдөг
const STALL_CHECK_MS = 15000;   // гацсан бол дахин холбох

const $ = (s) => document.querySelector(s);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};

let cams = [];   // [{url,label,stations:[],districts:[]}]
let page = 0;
let favs = new Set(store.get('favs', []));
let rotTimer = null;

function buildCams(stations) {
  const byUrl = new Map();
  for (const s of stations) {
    for (const c of s.cams || []) {
      if (!c || !c.url) continue;
      let e = byUrl.get(c.url);
      if (!e) {
        e = { url: c.url, label: (c.label || '').trim(), stations: [], districts: new Set() };
        byUrl.set(c.url, e);
      }
      if (!e.label && c.label) e.label = c.label.trim();
      if (!e.stations.includes(s.name)) e.stations.push(s.name);
      if (s.district) e.districts.add(s.district);
    }
  }
  return [...byUrl.values()].map((e) => ({
    ...e,
    id: (e.url.match(/live\/([^/]+?)\.stream/) || [])[1] || e.url,
    label: e.label || ('Камер ' + ((e.url.match(/live\/(\d+)/) || [])[1] || '')),
    districts: [...e.districts],
  })).sort((a, b) => a.label.localeCompare(b.label, 'mn'));
}

async function load(force) {
  $('#stat').textContent = 'Ачаалж байна…';
  let stations = null, live = false;
  try {
    const r = await fetch(API, { cache: force ? 'no-store' : 'default' });
    if (!r.ok) throw new Error(r.status);
    const d = await r.json();
    stations = (d.stations || d).filter((s) => Array.isArray(s.cams) && s.cams.length);
    live = true;
  } catch (e) {
    stations = FALLBACK;
  }
  cams = buildCams(stations);
  const districts = [...new Set(cams.flatMap((c) => c.districts))].sort((a, b) => a.localeCompare(b, 'mn'));
  const sel = $('#district'), cur = sel.value;
  sel.innerHTML = '<option value="">Бүх дүүрэг</option>' +
    districts.map((d) => `<option>${esc(d)}</option>`).join('');
  sel.value = districts.includes(cur) ? cur : '';
  $('#warn').innerHTML = live ? '' :
    '<div class="warn">benzin.mn-ээс жагсаалт татаж чадсангүй — хадгалсан хуулбарыг харуулж байна.</div>';
  checkHls();
  render();
}

function checkHls() {
  const v = document.createElement('video');
  if (!v.canPlayType('application/vnd.apple.mpegurl') && !v.canPlayType('application/x-mpegURL')) {
    $('#warn').innerHTML += '<div class="warn">Энэ хөтөч HLS (.m3u8) дамжуулалтыг шууд тоглуулахгүй байж магадгүй. ' +
      'Chrome/Edge-ийн хамгийн сүүлийн хувилбар эсвэл Safari ашиглана уу.</div>';
  }
}

function esc(s) { return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

function filtered() {
  const q = $('#q').value.trim().toLowerCase();
  const d = $('#district').value;
  const fo = $('#favOnly').checked;
  const list = cams.filter((c) =>
    (!d || c.districts.includes(d)) &&
    (!fo || favs.has(c.id)) &&
    (!q || (c.label + ' ' + c.stations.join(' ') + ' ' + c.districts.join(' ')).toLowerCase().includes(q)));
  // Дуртайг эхэнд нь
  return list.sort((a, b) => (favs.has(b.id) - favs.has(a.id)));
}

function stopVideo(v) {
  clearTimeout(v._retry); clearInterval(v._stall);
  v.pause(); v.removeAttribute('src'); v.load();
}

/* <video src=m3u8> — crossorigin атрибутгүй байх ёстой (stream нь зөвхөн
   ubtraffic.mn-д CORS зөвшөөрдөг, no-cors media load-д хамаарахгүй). */
function attach(v, url, badge) {
  v._tries = 0;
  const start = () => {
    v.src = url;
    v.load();
    const p = v.play(); if (p && p.catch) p.catch(() => {});
  };
  v.onplaying = () => { v._tries = 0; if (badge) { badge.textContent = '● LIVE'; badge.className = 'badge live'; } };
  v.onerror = () => {
    if (!v.hasAttribute('src')) return;
    if (v._tries >= MAX_RETRIES) { if (badge) { badge.textContent = 'Ажиллахгүй байна'; badge.className = 'badge err'; } return; }
    v._tries++;
    if (badge) { badge.textContent = `Асааж байна… (${v._tries})`; badge.className = 'badge'; }
    clearTimeout(v._retry);
    v._retry = setTimeout(start, 4000);
  };
  // Гацалт шалгах: currentTime өөрчлөгдөхгүй бол дахин холбоно
  let last = -1;
  clearInterval(v._stall);
  v._stall = setInterval(() => {
    if (!v.hasAttribute('src') || document.hidden) return;
    if (v.currentTime === last && v.readyState < 3) { v._tries = 0; start(); }
    last = v.currentTime;
  }, STALL_CHECK_MS);
  if (badge) { badge.textContent = 'Асааж байна…'; badge.className = 'badge'; }
  start();
}

function render() {
  document.querySelectorAll('#grid video').forEach(stopVideo);
  const list = filtered();
  const per = +$('#per').value;
  const pages = Math.max(1, Math.ceil(list.length / per));
  if (page >= pages) page = 0;
  const shown = list.slice(page * per, page * per + per);
  $('#pageInfo').textContent = `${page + 1}/${pages}`;
  $('#stat').textContent = `${list.length} камер (нийт ${cams.length})`;
  const cols = per >= 999 ? 4 : per <= 4 ? 2 : per <= 9 ? 3 : 4;
  $('#grid').style.setProperty('--cols', cols);
  store.set('prefs', { per: $('#per').value, district: $('#district').value });

  const grid = $('#grid');
  grid.innerHTML = '';
  if (!shown.length) { grid.innerHTML = '<div class="empty">Камер олдсонгүй.</div>'; return; }
  for (const c of shown) {
    const t = document.createElement('div');
    t.className = 'tile' + (favs.has(c.id) ? ' fav' : '');
    t.innerHTML = `
      <video muted autoplay playsinline></video>
      <span class="badge"></span>
      <div class="tools">
        <button data-a="fav" title="Дуртай">${favs.has(c.id) ? '★' : '☆'}</button>
        <button data-a="re" title="Дахин холбох">⟳</button>
        <button data-a="big" title="Томоор">⛶</button>
      </div>
      <div class="cap"><b>${esc(c.label)}</b><small>${esc(c.stations.join(', '))}${c.districts.length ? ' · ' + esc(c.districts.join(', ')) : ''}</small></div>`;
    const v = t.querySelector('video'), badge = t.querySelector('.badge');
    t.querySelector('[data-a=fav]').onclick = (e) => { e.stopPropagation(); toggleFav(c.id); };
    t.querySelector('[data-a=re]').onclick = (e) => { e.stopPropagation(); attach(v, c.url, badge); };
    t.querySelector('[data-a=big]').onclick = (e) => { e.stopPropagation(); openBig(c); };
    t.ondblclick = () => openBig(c);
    grid.appendChild(t);
    attach(v, c.url, badge);
  }
}

function toggleFav(id) {
  favs.has(id) ? favs.delete(id) : favs.add(id);
  store.set('favs', [...favs]);
  render();
}

function openBig(c) {
  $('#bigTitle').textContent = c.label;
  $('#bigSub').textContent = c.stations.join(', ') + (c.districts.length ? ' · ' + c.districts.join(', ') : '');
  $('#big').hidden = false;
  attach($('#bigVideo'), c.url, null);
}
function closeBig() { $('#big').hidden = true; stopVideo($('#bigVideo')); }

function setRotate() {
  clearInterval(rotTimer);
  if (!$('#rotate').checked) return;
  const sec = Math.max(10, +$('#rotSec').value || 30);
  rotTimer = setInterval(() => { if ($('#big').hidden) { next(); } }, sec * 1000);
}
function next() { const per = +$('#per').value; const pages = Math.max(1, Math.ceil(filtered().length / per)); page = (page + 1) % pages; render(); }
function prev() { const per = +$('#per').value; const pages = Math.max(1, Math.ceil(filtered().length / per)); page = (page - 1 + pages) % pages; render(); }

const prefs = store.get('prefs', {});
if (prefs.per) $('#per').value = prefs.per;
$('#q').oninput = () => { page = 0; render(); };
$('#district').onchange = () => { page = 0; render(); };
$('#favOnly').onchange = () => { page = 0; render(); };
$('#per').onchange = () => { page = 0; render(); };
$('#next').onclick = next; $('#prev').onclick = prev;
$('#rotate').onchange = setRotate; $('#rotSec').onchange = setRotate;
$('#reload').onclick = () => load(true);
$('#bigClose').onclick = closeBig;
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeBig();
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowRight') next();
  if (e.key === 'ArrowLeft') prev();
});
// Таб нуугдсан үед дамжуулалтыг зогсоож, буцаж ирэхэд дахин асаана
document.addEventListener('visibilitychange', () => { if (!document.hidden) render(); else document.querySelectorAll('#grid video').forEach(stopVideo); });

load().then(() => { if (prefs.district) { $('#district').value = prefs.district; render(); } });
</script>
